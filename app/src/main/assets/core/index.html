<body>
<div id="app"></div>
<div id="root"></div>
<div id="container"></div>
<div id="stage"></div>
<div id="chat"></div>
<div id="ui"></div>

<div class="box">
  <div id="status">诊断页面 ✅</div>
  <div>NativeBridge: <span id="b">checking...</span></div>
  <div>AndroidBridge: <span id="a">checking...</span></div>
  <div>ai_core.js: <span id="s1">未加载</span></div>
  <div>bridge.js: <span id="s2">未加载</span></div>
  <div>HoshinoAI: <span id="h1">未检查</span></div>
  <div>HoshinoBridge: <span id="h2">未检查</span></div>
  <button onclick="loadOriginal()">加载原前端</button>
  <button onclick="checkGlobals()">检查全局</button>
  <button onclick="testChat()">测试 chat()</button>
  <div id="log"></div>
  <div class="err" id="err"></div>
</div>

<script>
function log(m){ document.getElementById('log').textContent += m + '\n'; }
function err(m){ document.getElementById('err').textContent += m + '\n'; }

window.onerror = function(e){ err('ERROR: ' + e); };
window.addEventListener('unhandledrejection', function(e){
  err('PROMISE: ' + (e.reason && e.reason.message || e.reason));
});

var b = typeof window.NativeBridge;
var a = typeof window.AndroidBridge;
document.getElementById('b').textContent = b + (b==='object' ? ' ✅' : ' ❌');
document.getElementById('a').textContent = a + (a==='object' ? ' ✅' : ' ❌');

function loadOriginal(){
  log('开始加载原前端...');
  var s1 = document.createElement('script');
  s1.src = 'ai_core.js';
  s1.onload = function(){ document.getElementById('s1').textContent = '✅ 已加载'; log('ai_core.js 加载成功'); };
  s1.onerror = function(){ document.getElementById('s1').textContent = '❌ 失败'; err('ai_core.js 加载失败'); };
  document.body.appendChild(s1);

  var s2 = document.createElement('script');
  s2.src = 'bridge.js';
  s2.onload = function(){
    document.getElementById('s2').textContent = '✅ 已加载';
    log('bridge.js 加载成功');
    setTimeout(checkGlobals, 500);
    setTimeout(function(){
      log('body children: ' + document.body.children.length);
      log('body html 长度: ' + document.body.innerHTML.length);
      log('HoshinoAI: ' + typeof window.HoshinoAI);
      log('HoshinoBridge: ' + typeof window.HoshinoBridge);
      document.getElementById('h1').textContent = typeof window.HoshinoAI;
      document.getElementById('h2').textContent = typeof window.HoshinoBridge;
      if(window.HoshinoAI) log('HoshinoAI.chat 类型: ' + typeof window.HoshinoAI.chat);
      if(window.HoshinoBridge) log('HoshinoBridge.raw: ' + (window.HoshinoBridge.raw ? '有桥' : '无桥'));
    }, 800);
  };
  s2.onerror = function(){ document.getElementById('s2').textContent = '❌ 失败'; err('bridge.js 加载失败'); };
  document.body.appendChild(s2);
}

function checkGlobals(){
  log('检查全局...');
  document.getElementById('h1').textContent = typeof window.HoshinoAI;
  document.getElementById('h2').textContent = typeof window.HoshinoBridge;

  if(window.HoshinoAI){
    log('✅ HoshinoAI 已暴露');
    log('chat: ' + typeof window.HoshinoAI.chat);
    log('memory dialogues: ' + window.HoshinoAI.memory.hotLayer.dialogues.length);
  } else {
    log('⚠️ window.HoshinoAI 不存在');
  }

  if(window.HoshinoBridge){
    log('✅ HoshinoBridge 已暴露');
    log('raw bridge: ' + (window.HoshinoBridge.raw ? '有' : '无'));
  } else {
    log('⚠️ window.HoshinoBridge 不存在');
  }

  var skip = new Set(['window','document','HTMLElement','Element','Node','Object','Array','Function','String','Number','Boolean','Math','JSON','Promise','console','navigator','location','history','localStorage','sessionStorage','performance','fetch','XMLHttpRequest','WebSocket','NativeBridge','AndroidBridge','HoshinoAI','HoshinoBridge']);
  var found = [];
  Object.keys(window).forEach(function(k){
    if(skip.has(k)) return;
    var t = typeof window[k];
    if(t === 'function' || (t === 'object' && window[k] !== null)){
      found.push(k + ':' + t);
    }
  });
  if(found.length){
    log('其它暴露项(前50): ' + found.slice(0,50).join(', '));
  } else {
    log('其它额外暴露对象/函数：无');
  }
}

function testChat(){
  if(!window.HoshinoAI){
    err('HoshinoAI 还没暴露，先加载原前端/检查全局');
    return;
  }
  try {
    var r = window.HoshinoAI.chat('前辈，在吗？');
    log('chat 返回: ' + r);
  } catch(e){
    err('chat 报错: ' + (e && e.message || e));
  }
}
</script>
</body>
